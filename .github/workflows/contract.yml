name: Contract
# SDK ↔ live /.well-known/eid (src/test/java/mn/eidmongolia/eid/ContractTest.java, routes = Routes.java). No secrets —
# discovery is public. Daily 00:00 UTC (08:00 +08), manual, and on PRs/main; a failure uses GitHub's default notification.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: contract test (live discovery)
        env:
          EID_CONTRACT: "1"
        run: ./gradlew test --tests mn.eidmongolia.eid.ContractTest --rerun --no-daemon --console=plain
