name: Release
# <x.y.z> tag (JitPack version = tag) → full CI → jar, sources, javadoc built with VERSION = tag → GitHub Release assets.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: jars (version = tag)
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew assemble --no-daemon --console=plain && ls -l build/libs
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          awk -v t="## $TAG " 'index($0, t) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" build/libs/*.jar --clobber
